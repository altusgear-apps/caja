<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caja Altus</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caja Altus">
<meta name="theme-color" content="#FEFAE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151C0D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de teléfono (máx. 560px), encabezado fijo arriba y pestañas fijas abajo; capturar es lo primero, el P&L vive en Resumen */
:root{
  --bg:#FEFAE0; --surface:#FFFFFF; --sunk:#F5F0D3; --fg:#283618; --muted:#5F6744; --line:#E2DAB3;
  --accent:#BC6C25; --on-accent:#FFFFFF; --accent-soft:#F6E5D2; --sand:#DDA15E; --olive:#606C38; --olive-soft:#E8EAD3;
  --good:#3F7A2B; --warn:#9A5F0E; --warn-soft:#F7E8CC; --bad:#A3362A; --bad-soft:#F6DCD6;
  --f-display:"Cinzel", Georgia, "Times New Roman", serif;
  --f-body:"Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151C0D; --surface:#212C14; --sunk:#1B2410; --fg:#F5F0D2; --muted:#B9B593; --line:#36451F;
    --accent:#DDA15E; --on-accent:#1A2310; --accent-soft:#3B2F1B; --sand:#DDA15E; --olive:#A4B06E; --olive-soft:#2C381A;
    --good:#8DBA6A; --warn:#E3AE57; --warn-soft:#3A2E16; --bad:#E58470; --bad-soft:#3B1F19; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:0;padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:10px;padding-bottom:10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:18px}
.brand span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top-right{display:flex;align-items:center;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;
  background:var(--sunk);color:var(--muted);white-space:nowrap;border:0;cursor:pointer}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
.status.ok{color:var(--good)} .status.warn{color:var(--warn);background:var(--warn-soft)} .status.bad{color:var(--bad);background:var(--bad-soft)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;color:var(--muted);text-decoration:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 12px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}

main{padding-top:16px}
h2{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.06em;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);font-size:13px}
.banner b{color:var(--warn)}

.tipos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.tipos{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tipo{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:12px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:64px}
.tipo strong{font-size:15px}
.tipo small{font-size:11.5px;color:var(--muted);line-height:1.3}
.tipo[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tipo[aria-pressed="true"] strong{color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%;min-height:52px;font-size:16px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.foto-btn{width:100%;border-style:dashed}
.assist-msg{font-size:13px;color:var(--muted)}
.assist-msg.err{color:var(--bad)}
.foto{display:flex;gap:10px;align-items:center;padding:8px;border-radius:var(--r);background:var(--sunk)}
.foto img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:var(--line)}
.foto div{flex:1;min-width:0;font-size:13px}
.foto button{border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;padding:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;grid-column:span 2}
.field.half{grid-column:span 1}
.field > label,.field > .lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .opt{font-weight:500;opacity:.8}
.field input:not([type=radio]),.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:8px;
  border:1.5px solid var(--line);background:var(--bg);font-size:16px;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field input[type=date]{min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field.missing input,.field.missing select,.field.missing .chips{box-shadow:0 0 0 2px var(--bad);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips label{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer}
.chips input:checked + label{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chips input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.badge.fijo{background:var(--olive-soft);color:var(--olive)}
.badge.semifijo{background:var(--warn-soft);color:var(--warn)}
.badge.variable{background:var(--accent-soft);color:var(--accent)}
.total{grid-column:span 2;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
.total b{font-size:22px}
.total span{font-size:12.5px;color:var(--muted);text-align:right}
.err-msg{font-size:13px;color:var(--bad)}
.edit-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--olive-soft);font-size:13px;font-weight:600}
.save-row{display:flex;flex-direction:column;gap:8px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{min-height:40px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:14px}
.day{display:flex;flex-direction:column;gap:6px}
.day h3{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;white-space:nowrap}
.tag.venta{background:var(--olive-soft);color:var(--olive)}
.tag.gasto{background:var(--accent-soft);color:var(--accent)}
.tag.compra{background:var(--warn-soft);color:var(--warn)}
.tag.socios{background:var(--sunk);color:var(--muted)}
.row .t{min-width:0}
.row .t div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-weight:700;text-align:right}
.row .m small{display:block;font-weight:600;font-size:11px;color:var(--warn)}
.pos{color:var(--good)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:30px;font-weight:700;letter-spacing:-.01em}
.big span{color:var(--muted);font-size:14px}
.bar{position:relative;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar > i{position:absolute;inset:0 auto 0 0;background:var(--olive);border-radius:999px}
.bar > em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.legend{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lines{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.line-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;align-items:center;font-size:13px}
.line-row .bar{height:8px}
.line-row span{grid-column:2;color:var(--muted);font-size:12px}
.dev{font-size:13px;font-weight:600}
.dev.down{color:var(--bad)} .dev.up{color:var(--good)}
table.pl{width:100%;border-collapse:collapse;font-size:14px}
table.pl td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.pl td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
table.pl tr.sub td:first-child{padding-left:14px;color:var(--muted)}
table.pl tr.strong td{font-weight:700;border-bottom:2px solid var(--fg)}
table.pl tr.last td{border-bottom:0}
table.pl small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13px;min-width:340px}
table.grid th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 0 6px 10px;border-bottom:1px solid var(--line)}
table.grid th:first-child,table.grid td:first-child{text-align:left;padding-left:0}
table.grid td{text-align:right;padding:8px 0 8px 10px;border-bottom:1px solid var(--line)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.flag.ok{background:var(--olive-soft);color:var(--olive)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.clasif{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.clasif:last-child{border-bottom:0}
.clasif .chips label{padding:7px 11px;font-size:13px}
.sync-time{font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:30;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){ .toast{animation:up .18s ease-out} @keyframes up{from{transform:translate(-50%,8px);opacity:0}} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>ALTUS</b><span>Caja</span></div>
    <div class="top-right">
      <button class="status" id="status" type="button" aria-live="polite"><i></i><span>Abriendo…</span></button>
      <a class="icon-btn" href="#ajustes" data-tab="ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
    </div>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap">
    <a href="#registrar" data-tab="registrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Registrar</a>
    <a href="#movimientos" data-tab="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Movimientos</a>

  </div>
</nav>

<div id="toast" class="toast" hidden></div>
<input type="file" id="foto-input" accept="image/*" hidden>

<script>
(function(){
"use strict";

/* ---------- configuración de instalación ----------
   URL_API: la dirección de la aplicación web de Apps Script (termina en /exec).
   Si se deja vacía, la app la pide en Ajustes la primera vez. */
var URL_API = "https://script.google.com/macros/s/AKfycbyJDDc6waYfCQfIFObBf2WrnDP2Fz-ZG6PPQvnHWZiPJspNYhIwngt7hsdvV0MyO6Xz/exec";
var VERSION_APP = "1.0";

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const mesActual = () => hoy().slice(0,7);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MESES_C = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const mesLabel = ym => { const [y,m] = ym.split("-"); return `${MESES[+m-1]} ${y}`; };
const diaLabel = f => { const [y,m,d] = String(f).split("-"); const dt = new Date(+y, +m-1, +d);
  return `${["dom","lun","mar","mié","jue","vie","sáb"][dt.getDay()]} ${+d} ${MESES_C[+m-1]}`; };
const fmt0 = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0});
const fmt2 = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:0,maximumFractionDigits:2});
const money = (n, dec) => (dec ? fmt2 : fmt0).format(Number(n) || 0);
const neg = v => v ? "−" + money(v) : money(0);
const pl = (n, a, b) => n + " " + (n === 1 ? a : b);
const pct = n => isFinite(n) ? (n*100).toFixed(1).replace(/\.0$/,"") + "%" : "—";
const num = v => { if (v === null || v === undefined || v === "") return null; const n = Number(String(v).replace(/[$,\s]/g,"")); return isFinite(n) ? n : null; };
const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80);
const newId = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const LS = {
  get(k, d){ try { const v = localStorage.getItem("cajaAltus." + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("cajaAltus." + k, JSON.stringify(v)); } catch(e){} }
};
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), ms))]);
const horaLabel = iso => { if (!iso) return ""; const d = new Date(iso); return `${diaLabel(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ---------- cola en el teléfono (IndexedDB, con respaldo en localStorage) ---------- */
const Cola = (() => {
  let dbp = null, sinIDB = false;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open("cajaAltus", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("cola", { keyPath:"id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch(e){ rej(e); }
    }).catch(e => { sinIDB = true; return null; });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction("cola", mode), req = fn(t.objectStore("cola"));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    }));
  }
  const lsAll = () => LS.get("cola", []);
  return {
    async all(){ const db = await open(); return db ? tx("readonly", s => s.getAll()) : lsAll(); },
    async put(it){ const db = await open(); if (db) return tx("readwrite", s => s.put(it));
      const a = lsAll().filter(x => x.id !== it.id); const c = Object.assign({}, it); delete c.foto; a.push(c); LS.set("cola", a); },
    async del(id){ const db = await open(); if (db) return tx("readwrite", s => s.delete(id)); LS.set("cola", lsAll().filter(x => x.id !== id)); },
    get sinFotos(){ return sinIDB; }
  };
})();

function mergeCfg(c){ return Object.assign({}, DEFAULTS, c || {}, { lineas: (c && c.lineas) || DEFAULTS.lineas, metas: Object.assign({}, DEFAULTS.metas, (c && c.metas) || {}) }); }
function freshVals(keep){

/* ---------- datos combinados ---------- */
function movimientos(){
  const m = new Map(S.server), pend = new Set();
  for (const q of S.queue){ pend.add(q.id); if (q.op === "set") m.set(q.id, Object.assign({}, q.data, q.foto ? { _foto:true } : {})); else m.delete(q.id); }
  return [...m.entries()].map(([id, d]) => Object.assign({}, d, { id, _pend: pend.has(id) }));
}
function claseDe(concepto){ const c = S.conceptos.get(slug(concepto)); return c && c.clase ? c.clase : null; }

/* ---------- conexión con la hoja ---------- */
async function api(accion, payload){
  if (!configurada()) throw { code:"sin_config" };
  let r;
  try {
    r = await withTimeout(fetch(S.url, { method:"POST", redirect:"follow", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ accion, clave: S.clave }, payload || {})) }), 30000);
  } catch(e){ throw { code: e && e.code === "timeout" ? "timeout" : "red" }; }
  if (!r.ok) throw { code:"http", status:r.status };
  let j; try { j = await r.json(); } catch(e){ throw { code:"respuesta" }; }
  if (!j.ok) throw { code: j.error || "servidor", message: j.mensaje };
  return j;
}
async function cargarDatos(){
  const j = await api("datos");
  S.server = new Map((j.movimientos || []).map(m => [m.id, m]));
  S.conceptos = new Map((j.conceptos || []).map(c => [c.concepto_id, c]));
  S.cfg = mergeCfg(j.catalogo);
  S.ultimaSync = new Date().toISOString();
  LS.set("datos", { movimientos: j.movimientos || [], conceptos: j.conceptos || [], catalogo: j.catalogo || {} });
  LS.set("ultimaSync", S.ultimaSync);
}
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = rej; fr.readAsDataURL(b); });

async function refreshQueue(){ try { S.queue = (await Cola.all()).sort((a, b) => a.t - b.t); } catch(e){ S.queue = []; } }
async function encolar(it){ it.t = Date.now(); await Cola.put(it); await refreshQueue(); flush(); }

async function flush(){
  if (S.flushing || !configurada() || !navigator.onLine){ renderStatus(); return; }
  S.flushing = true; S.error = null; renderStatus();
  try {
    const items = (await Cola.all()).sort((a, b) => a.t - b.t);
    for (const it of items){
      if (it.op === "set" && it.foto && !it.data.foto_url){
        const r = await api("foto", { id: it.id, fecha: it.data.fecha, base64: await blobToB64(it.foto) });
        it.data.foto_url = r.url; delete it.foto; await Cola.put(it);
      }
      await api("guardar", { ops: [{ op: it.op, id: it.id, data: it.data }] });
      await Cola.del(it.id);
    }
    await cargarDatos();
  } catch(e){ S.error = e; }
  S.flushing = false;
  await refreshQueue();
  render();
}
window.addEventListener("online", () => flush());
window.addEventListener("offline", renderStatus);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flush(); });
setInterval(() => { if (navigator.onLine && (S.queue.length || !S.ultimaSync)) flush(); }, 30000);

function errorTexto(e){
  if (!e) return "";
  if (e.code === "clave") return "La clave no coincide con la de la hoja.";
  if (e.code === "sin_config") return "Falta configurar la conexión.";
  if (e.code === "red" || e.code === "timeout") return "No hubo respuesta de la hoja. Se reintenta solo.";
  if (e.code === "http") return `La hoja respondió con error ${e.status}. Revisa la dirección en Ajustes.`;
  if (e.code === "respuesta") return "La dirección no parece ser la de la hoja. Revísala en Ajustes.";
  return "La hoja rechazó la operación" + (e.message ? `: ${e.message}` : ".");
}
function renderStatus(){
  const el = $("#status"), n = S.queue.length;
  let cls = "", txt;
  if (!configurada()){ cls = "bad"; txt = "Sin configurar"; }
  else if (!navigator.onLine){ cls = "warn"; txt = n ? `Sin señal · ${n} por subir` : "Sin señal"; }
  else if (S.flushing){ cls = "warn"; txt = n ? `Subiendo ${n}…` : "Actualizando…"; }
  else if (S.error && S.error.code === "clave"){ cls = "bad"; txt = "Clave incorrecta"; }
  else if (S.error){ cls = "warn"; txt = n ? `${n} por subir` : "Sin conexión con la hoja"; }
  else if (n){ cls = "warn"; txt = `${n} por subir`; }
  else { cls = "ok"; txt = "Al día"; }
  el.className = "status " + cls;
  el.lastElementChild.textContent = txt;
}

/* ---------- guardar ---------- */
function construir(minimo){
  const t = S.tipo, v = S.vals, req = [];
  const need = (k, ok) => { if (!ok && !minimo) req.push(k); };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.fecha || "")) req.push("fecha");
  need("quien", !!v.quien);
  const d = { tipo:t, fecha:v.fecha, quien:v.quien || "", nota:(v.nota || "").trim() };
  if (t === "venta"){
    const q = num(v.cantidad), p = num(v.precio), c = num(v.costo);
    need("linea", !!v.linea); need("cantidad", q != null && q > 0); need("precio", p != null && p > 0); need("canal", !!v.canal);
    Object.assign(d, { linea:v.linea || "", subcategoria:v.subcategoria || "", producto:(v.producto || "").trim(), cantidad:q,
      precio_unitario:p, costo_unitario:c, monto: q != null && p != null ? Math.round(q*p*100)/100 : null,
      canal:v.canal || "", metodo:v.metodo || "", origen:v.origen || "", unidad: v.linea === "Management" ? "Management" : "Gear" });
  } else if (t === "gasto"){
    const m = num(v.monto);
    need("concepto", !!(v.concepto || "").trim()); need("monto", m != null && m > 0);
    Object.assign(d, { concepto:(v.concepto || "").trim(), monto:m, cargo:v.cargo || "General", metodo:v.metodo || "" });
  } else if (t === "compra"){
    const m = num(v.monto);
    need("linea", !!v.linea); need("producto", !!(v.producto || "").trim()); need("monto", m != null && m > 0);
    Object.assign(d, { linea:v.linea || "", subcategoria:v.subcategoria || "", producto:(v.producto || "").trim(), piezas:num(v.piezas),
      monto:m, proveedor:(v.proveedor || "").trim(), metodo:v.metodo || "" });
  } else {
    const m = num(v.monto);
    need("direccion", !!v.direccion); need("monto", m != null && m > 0);
    Object.assign(d, { socio:v.quien || "", direccion:v.direccion, monto:m });
  }
  return { d, req };
}
const NOMBRES = { fecha:"fecha", quien:"quién", linea:"línea", cantidad:"cantidad", precio:"precio", canal:"canal", concepto:"concepto", monto:"monto", producto:"qué se compró", direccion:"tipo de movimiento" };
async function guardar(soloFoto){
  const { d, req } = construir(soloFoto);
  if (req.length){
    S.missing = req; S.errMsg = "Falta: " + req.map(k => NOMBRES[k] || k).join(", ") + ".";
    render(); const f = document.querySelector(".field.missing"); if (f) f.scrollIntoView({ block:"center", behavior:"smooth" });
    return;
  }
  const now = new Date().toISOString(), prev = S.editId ? movimientos().find(m => m.id === S.editId) : null;
  Object.assign(d, {
    foto_url: S.fotoUrl || "", fuente: prev ? (prev.fuente || "manual") : (S.fotoBlob ? "foto" : "manual"),
    por_revisar: prev ? !!prev.por_revisar : false,
    por_leer: soloFoto ? true : false,
    creado_en: S.editCreado || now, actualizado_en: now, dispositivo: S.yo || ""
  });
  const id = S.editId || newId();
  const it = { id, op:"set", data:d };
  const prevQ = S.queue.find(q => q.id === id);
  if (S.fotoBlob) it.foto = S.fotoBlob; else if (prevQ && prevQ.foto) it.foto = prevQ.foto;
  if (d.quien && !S.yo){ S.yo = d.quien; LS.set("quien", d.quien); }
  LS.set("ultimoTipo", S.tipo);
  const fueEdicion = !!S.editId;
  resetForm(true);
  render();
  try { await encolar(it); } catch(e){ toast("No se pudo guardar en el teléfono. Inténtalo de nuevo."); return; }
  toast(fueEdicion ? "Cambios guardados" : soloFoto ? "Foto guardada · queda por leer" : (navigator.onLine && configurada() ? "Guardado" : "Guardado en el teléfono · se sube con señal"));
}
function limpiarFoto(){ if (S.fotoPreview){ try { URL.revokeObjectURL(S.fotoPreview); } catch(e){} } S.fotoBlob = null; S.fotoPreview = null; S.fotoUrl = null; }
function resetForm(keep){
  S.vals = freshVals(keep ? S.vals : null); S.editId = null; S.editCreado = null; S.delArmed = false;
  limpiarFoto(); S.missing = []; S.errMsg = ""; S.assistMsg = ""; S.assistErr = false;
}
function editar(id){
  const m = movimientos().find(x => x.id === id); if (!m) return;
  resetForm(false);
  S.editId = id; S.editCreado = m.creado_en || null; S.tipo = m.tipo;

    subcategoria:s(m.subcategoria), producto:s(m.producto), cantidad:s(m.cantidad), precio:s(m.precio_unitario), costo:s(m.costo_unitario),
    canal:s(m.canal), metodo:s(m.metodo), origen:s(m.origen), concepto:s(m.concepto), monto:s(m.monto), cargo:s(m.cargo) || "General",
    piezas:s(m.piezas), proveedor:s(m.proveedor), direccion:s(m.direccion) || "aportacion" };
  S.fotoUrl = m.foto_url || null;
  if (m.por_leer) S.assistMsg = "Este movimiento se guardó solo con foto. Complétalo y guarda.";
  location.hash = "registrar";
}

/* ---------- foto ---------- */
async function comprimir(file){
  let img;
  try { img = await createImageBitmap(file); }
  catch(e){ img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.72));
}
async function onFoto(file){
  if (!file) return;
  S.assistErr = false; S.assistMsg = "Preparando la foto…"; render();
  try {
    const b = await comprimir(file);
    if (!b) throw new Error("sin imagen");
    limpiarFoto(); S.fotoBlob = b; S.fotoPreview = URL.createObjectURL(b);
    S.assistMsg = S.editId ? "Foto lista. Guarda los cambios para subirla."
      : "Foto lista. Llena los datos y guarda, o guárdala sola y se completa después.";
  } catch(e){ S.assistMsg = "No pude abrir esa imagen. Prueba con otra captura."; S.assistErr = true; }
  render();
}

/* ---------- vista Movimientos ---------- */
function descMov(m){
  if (m.tipo === "venta") return (m.cantidad && Number(m.cantidad) !== 1 ? m.cantidad + " × " : "") + (m.producto || [m.linea, m.subcategoria].filter(Boolean).join(" · ") || "Venta");
  if (m.tipo === "gasto") return m.concepto || "Gasto";
  if (m.tipo === "compra") return m.producto || "Compra de inventario";
  return (m.direccion === "retiro" ? "Retiro · " : "Aportación · ") + (m.socio || m.quien || "");
}
function subMov(m){
  const p = [m.tipo !== "socios" ? m.quien : null];
  if (m.tipo === "venta") p.push(m.linea, m.canal, (m.costo_unitario === null || m.costo_unitario === "" || m.costo_unitario === undefined) ? "sin costo" : null);
  if (m.tipo === "gasto"){ const c = claseDe(m.concepto); p.push(m.cargo, c ? CLASES[c] : "por clasificar"); }
  if (m.tipo === "compra") p.push(m.linea, m.proveedor);
  if (m.por_leer) p.push("foto por leer");
  if (m.por_revisar) p.push("por revisar");
  if (m.foto_url || m._foto) p.push("con foto");
  return p.filter(Boolean).join(" · ");
}
function mesesDisponibles(){
  return [...new Set([mesActual(), ...movimientos().map(m => String(m.fecha || "").slice(0,7)).filter(Boolean)])].sort().reverse();
}
function viewMovimientos(){

      && (S.filtro === "todos" || (S.filtro === "revisar" ? (m.por_revisar || m.por_leer) : m.tipo === S.filtro)))
    .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)) || String(b.creado_en || "").localeCompare(String(a.creado_en || "")));
  const byDay = new Map(); for (const m of ms){ if (!byDay.has(m.fecha)) byDay.set(m.fecha, []); byDay.get(m.fecha).push(m); }
  const filtros = [["todos","Todos"],["venta","Ventas"],["gasto","Gastos"],["compra","Compras"],["socios","Socios"],["revisar","Por completar"]];
  const signo = m => m.tipo === "venta" || (m.tipo === "socios" && m.direccion !== "retiro") ? "+" : "−";
  return `<div class="stack">
    <h2>Movimientos</h2>

    </div>
    ${ms.length ? [...byDay.entries()].map(([f, arr]) => `<section class="day"><h3>${esc(diaLabel(f))}</h3>
      ${arr.map(m => `<button type="button" class="row" data-edit="${esc(m.id)}">
        <span class="tag ${esc(m.tipo)}">${m.tipo === "compra" ? "Compra" : TIPOS[m.tipo] ? TIPOS[m.tipo].nombre : esc(m.tipo)}</span>
        <span class="t"><div>${esc(descMov(m))}</div><small>${esc(subMov(m))}</small></span>
        <span class="m num ${m.tipo === "venta" ? "pos" : ""}">${m.monto ? signo(m) + money(m.monto, true) : "—"}${m._pend ? "<small>Por subir</small>" : ""}</span>

/* ---------- vista Resumen ---------- */
function calcular(mes){
  const ms = movimientos().filter(m => String(m.fecha || "").startsWith(mes));
  const r = { ventas:0, porLinea:{}, cogs:0, ventasConCosto:0, ventasSinCosto:0, nSinCosto:0, gastos:0,
    porClase:{ fijo:0, semifijo:0, variable:0, pendiente:0 }, porCargo:{}, compras:0, aport:0, retiro:0,
    canales:{}, personas:{}, revisar:0, porLeer:0, sinLinea:0 };
  for (const l of Object.keys(S.cfg.lineas)) r.porLinea[l] = 0;
  const P = q => (r.personas[q] = r.personas[q] || { cobro:0, pago:0, aporte:0, retiro:0 });
  for (const m of ms){
    const monto = Number(m.monto) || 0;
    if (m.por_revisar) r.revisar++;
    if (m.por_leer) r.porLeer++;
    if (m.tipo === "venta"){
      r.ventas += monto;
      if (m.linea && r.porLinea[m.linea] != null) r.porLinea[m.linea] += monto; else r.sinLinea += monto;
      const cu = num(m.costo_unitario);
      if (cu != null){ r.cogs += (num(m.cantidad) || 0) * cu; r.ventasConCosto += monto; } else if (monto){ r.ventasSinCosto += monto; r.nSinCosto++; }
      const c = m.canal || "Sin canal"; r.canales[c] = r.canales[c] || { n:0, total:0 }; r.canales[c].n++; r.canales[c].total += monto;
      if (m.quien) P(m.quien).cobro += monto;
    } else if (m.tipo === "gasto"){
      r.gastos += monto;
      const cl = claseDe(m.concepto);
      if (cl && r.porClase[cl] != null) r.porClase[cl] += monto; else r.porClase.pendiente += monto;
      const cg = m.cargo || "General"; r.porCargo[cg] = (r.porCargo[cg] || 0) + monto;
      if (m.quien) P(m.quien).pago += monto;
    } else if (m.tipo === "compra"){
      r.compras += monto; if (m.quien) P(m.quien).pago += monto;
    } else if (m.tipo === "socios"){
      const who = m.socio || m.quien;
      if (m.direccion === "retiro"){ r.retiro += monto; if (who) P(who).retiro += monto; } else { r.aport += monto; if (who) P(who).aporte += monto; }
    }
  }
  r.margenBruto = r.ventasConCosto - r.cogs;
  r.resultado = r.ventas - r.cogs - r.gastos;
  return r;
}
function viewResumen(){

  const [y, mm] = mes.split("-").map(Number);

  const ritmo = meta * frac, devRitmo = r.ventas - ritmo;
  const lineas = Object.keys(S.cfg.lineas), split = S.cfg.split || {};
  const bar = (v, max, mark) => `<div class="bar"><i style="width:${Math.min(100, max ? v / max * 100 : 0).toFixed(1)}%"></i>${mark != null && max ? `<em style="left:calc(${Math.min(100, mark / max * 100).toFixed(1)}% - 1px)"></em>` : ""}</div>`;
  const vacio = !movimientos().some(m => String(m.fecha || "").startsWith(mes));
  const canales = Object.entries(r.canales).sort((a, b) => b[1].total - a[1].total);
  const personas = Object.entries(r.personas);
  const pendientes = [...S.conceptos.values()].filter(c => !c.clase);
  const flags = [];
  if (r.nSinCosto) flags.push(`<span class="flag">${pl(r.nSinCosto,"venta","ventas")} sin costo · ${money(r.ventasSinCosto)}</span>`);
  if (r.porClase.pendiente) flags.push(`<span class="flag">${money(r.porClase.pendiente)} en gastos por clasificar</span>`);
  if (r.porLeer) flags.push(`<span class="flag">${pl(r.porLeer,"foto","fotos")} por leer</span>`);
  if (r.revisar) flags.push(`<span class="flag">${r.revisar} por revisar</span>`);
  if (r.sinLinea) flags.push(`<span class="flag">${money(r.sinLinea)} en ventas sin línea</span>`);
  if (!flags.length && !vacio) flags.push(`<span class="flag ok">Datos completos</span>`);
  const meses = [...new Set([...mesesDisponibles(), ...Object.keys(S.cfg.metas || {}).filter(k => k >= "2026-10" && k <= mesActual())])].sort().reverse();
  return `<div class="stack">
    <div class="filters" style="justify-content:space-between">
      <h2>Resumen</h2>
      <select id="mes-res" aria-label="Mes">${meses.map(x => `<option value="${x}" ${x === mes ? "selected" : ""}>${esc(mesLabel(x))}</option>`).join("")}</select>
    </div>
    ${vacio ? `<div class="empty"><b>Aún no hay movimientos en ${esc(mesLabel(mes))}.</b>Cuando registren ventas y gastos, aquí aparece el avance contra la meta y el estado de resultados.</div>` : ""}

    <section class="card stack" aria-labelledby="h-meta">
      <span class="eyebrow" id="h-meta">Ventas vs meta · ${esc(mesLabel(mes))}</span>
      <div class="big"><b class="num">${money(r.ventas)}</b><span class="num">${meta ? "de " + money(meta) + " · " + pct(r.ventas / meta) : "sin meta para este mes"}</span></div>
      ${meta ? bar(r.ventas, meta, esActual ? ritmo : null) + `
      <div class="legend"><span>${esActual ? `La marca es el ritmo para hoy: ${money(ritmo)}` : "Mes completo"}</span>
        <span class="dev num ${devRitmo < 0 ? "down" : "up"}">${devRitmo < 0 ? "Debajo" : "Arriba"} ${money(Math.abs(devRitmo))} (${pct(ritmo ? devRitmo / ritmo : 0)})</span></div>
      <div class="lines">${lineas.map(l => { const ml = meta * (split[l] || 0), v = r.porLinea[l] || 0;
        return `<div class="line-row"><b>${esc(l)}</b>${bar(v, ml, esActual ? ml * frac : null)}<span class="num">${money(v)} de ${money(ml)} · ${pct(ml ? v / ml : 0)}</span></div>`; }).join("")}</div>` : ""}
    </section>

    <section class="card stack" aria-labelledby="h-pl">
      <span class="eyebrow" id="h-pl">Estado de resultados · preliminar</span>
      <table class="pl num">
        <tr><td>Ventas</td><td>${money(r.ventas)}</td></tr>
        <tr class="sub"><td>Costo de lo vendido<small>${r.nSinCosto ? `Solo de ventas con costo (${money(r.ventasConCosto)})` : "Todas las ventas tienen costo"}</small></td><td>${neg(r.cogs)}</td></tr>
        <tr class="strong"><td>Margen bruto<small>${r.ventasConCosto ? pct(r.margenBruto / r.ventasConCosto) + " sobre ventas con costo" : "Sin ventas con costo todavía"}</small></td><td>${money(r.margenBruto)}</td></tr>
        <tr class="sub"><td>Gastos fijos</td><td>${neg(r.porClase.fijo)}</td></tr>
        <tr class="sub"><td>Gastos semifijos</td><td>${neg(r.porClase.semifijo)}</td></tr>
        <tr class="sub"><td>Gastos variables</td><td>${neg(r.porClase.variable)}</td></tr>
        <tr class="sub"><td>Gastos por clasificar</td><td>${neg(r.porClase.pendiente)}</td></tr>
        <tr class="strong last"><td>Resultado operativo<small>${r.nSinCosto ? `Sobrestimado: falta el costo de ${money(r.ventasSinCosto)} en ventas` : "Ventas menos costo y gastos"}</small></td><td class="${r.resultado < 0 ? "dev down" : ""}">${money(r.resultado)}</td></tr>
      </table>
      ${Object.keys(r.porCargo).length ? `<p class="note">Gastos por centro de costos: ${Object.entries(r.porCargo).map(([k, v]) => `${esc(k)} ${money(v)}`).join(" · ")}</p>` : ""}
    </section>

    <section class="card stack" aria-labelledby="h-canal">
      <span class="eyebrow" id="h-canal">Ventas por canal</span>
      ${canales.length ? `<div class="scroll"><table class="grid num"><thead><tr><th>Canal</th><th>Ventas</th><th>Total</th><th>Ticket prom.</th></tr></thead><tbody>
        ${canales.map(([c, x]) => `<tr><td>${esc(c)}</td><td>${x.n}</td><td>${money(x.total)}</td><td>${money(x.total / x.n)}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="note">Sin ventas en el mes.</p>`}
    </section>

    <section class="card stack" aria-labelledby="h-fuera">
      <span class="eyebrow" id="h-fuera">Fuera del resultado</span>
      <table class="pl num">
        <tr><td>Compras de inventario<small>Entran al costo cuando la pieza se vende</small></td><td>${money(r.compras)}</td></tr>
        <tr><td>Aportaciones de socios</td><td>${money(r.aport)}</td></tr>
        <tr class="last"><td>Retiros de socios</td><td>${money(r.retiro)}</td></tr>
      </table>
    </section>

    <section class="card stack" aria-labelledby="h-caja">
      <span class="eyebrow" id="h-caja">Dinero de Altus en manos de cada socio · ${esc(mesLabel(mes))}</span>
      ${personas.length ? `<div class="scroll"><table class="grid num"><thead><tr><th>Socio</th><th>Cobró</th><th>Pagó</th><th>Aportó</th><th>Retiró</th><th>Neto</th></tr></thead><tbody>
        ${personas.map(([p, x]) => { const n = x.cobro - x.pago + x.aporte - x.retiro;
          return `<tr><td>${esc(p)}</td><td>${money(x.cobro)}</td><td>${money(x.pago)}</td><td>${money(x.aporte)}</td><td>${money(x.retiro)}</td><td><b>${money(n)}</b></td></tr>`; }).join("")}
        </tbody></table></div>
        <p class="note">Neto positivo: tiene dinero de Altus en su cuenta. Negativo: puso de su bolsa y Altus le debe.</p>`
        : `<p class="note">Sin movimientos con responsable en el mes.</p>`}
    </section>

    ${pendientes.length ? `<section class="card stack" aria-labelledby="h-clas">
      <span class="eyebrow" id="h-clas">Conceptos de gasto por clasificar</span>
      <p class="note">Claude propone la clasificación en la revisión. Si ya la sabes, márcala aquí (necesita señal).</p>
      <div>${pendientes.map(c => `<div class="clasif"><b>${esc(c.nombre || c.concepto_id)}</b>
        <div class="chips" role="radiogroup" aria-label="Clase de ${esc(c.nombre || c.concepto_id)}">${Object.entries(CLASES).map(([k, t], i) =>
          `<input type="radio" id="c-${esc(c.concepto_id)}-${i}" name="c-${esc(c.concepto_id)}" data-clasif="${esc(c.concepto_id)}" value="${k}"><label for="c-${esc(c.concepto_id)}-${i}">${t}</label>`).join("")}</div></div>`).join("")}</div>
    </section>` : ""}

    <section class="stack" aria-labelledby="h-cal" style="gap:8px">
      <span class="eyebrow" id="h-cal">Calidad del dato</span>
      <div class="flags">${flags.join("") || '<span class="flag ok">Sin movimientos</span>'}</div>
      ${S.ultimaSync ? `<p class="sync-time">Datos de la hoja al ${esc(horaLabel(S.ultimaSync))}.</p>` : ""}
    </section>
  </div>`;
}

        : ios ? `<p class="note">Para que abra sin señal, instálala: en Safari toca <b>Compartir</b> y luego <b>Agregar a inicio</b>. Ábrela siempre desde ese ícono.</p>`
        : `<p class="note">Para que abra sin señal, instálala desde el menú del navegador con <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.</p>`}
      <p class="note">Pendientes en este teléfono: ${S.queue.length}. ${S.ultimaSync ? "Última actualización: " + esc(horaLabel(S.ultimaSync)) + "." : "Aún no se ha conectado con la hoja."}</p>

async function probar(){
  S.url = ($("#a-url").value || "").trim(); S.clave = ($("#a-clave").value || "").trim().toUpperCase();
  const yo = document.querySelector('input[name="a-yo"]:checked'); if (yo){ S.yo = yo.value; LS.set("quien", S.yo); if (!S.vals.quien) S.vals.quien = S.yo; }
  LS.set("url", S.url); LS.set("clave", S.clave);
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(S.url)){ S.pruebaOk = false; S.pruebaMsg = "La dirección debe ser la de la aplicación web de Apps Script y terminar en /exec."; render(); return; }
  S.probando = true; S.pruebaMsg = ""; render();
  try { const j = await api("ping"); S.pruebaOk = true; S.pruebaMsg = `Conectado con la hoja (motor v${j.version}).`; S.error = null; }
  catch(e){ S.pruebaOk = false; S.pruebaMsg = errorTexto(e); }
  S.probando = false; render();
  if (S.pruebaOk) flush();
}

/* ---------- render y eventos ---------- */
function render(){
  const main = $("#main");
  main.innerHTML = S.tab === "movimientos" ? viewMovimientos() : S.tab === "resumen" ? viewResumen() : S.tab === "ajustes" ? viewAjustes() : viewRegistrar();
  document.querySelectorAll("[data-tab]").forEach(a => a.setAttribute("aria-current", a.dataset.tab === S.tab ? "page" : "false"));
  renderStatus();
}
function route(){
  const h = (location.hash || "").replace("#", "");
  S.tab = ["registrar","movimientos","resumen","ajustes"].includes(h) ? h : (configurada() ? "registrar" : "ajustes");
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("#status").addEventListener("click", () => { location.hash = "ajustes"; });

const main = $("#main");
main.addEventListener("click", e => {
  const tb = e.target.closest("[data-tipo]");
  if (tb){
    const keep = { fecha:S.vals.fecha, quien:S.vals.quien, metodo:S.vals.metodo };
    const nota = S.vals.nota;
    S.tipo = tb.dataset.tipo;
    if (!S.editId) S.vals = Object.assign(freshVals(keep), { nota: nota || "" });
    S.missing = []; S.errMsg = ""; render(); return;
  }
  const ed = e.target.closest("[data-edit]"); if (ed){ editar(ed.dataset.edit); return; }
  const act = e.target.closest("[data-act]"); if (!act) return;
  const a = act.dataset.act;
  if (a === "guardar") guardar(false);
  else if (a === "guardar-foto") guardar(true);
  else if (a === "cancel-edit"){ resetForm(false); render(); }
  else if (a === "borrar"){
    if (!S.delArmed){ S.delArmed = true; render(); return; }
    const id = S.editId; resetForm(false); render();
    encolar({ id, op:"del", data:null }).then(() => toast("Movimiento eliminado"));
  }
  else if (a === "foto"){ const i = $("#foto-input"); i.value = ""; i.click(); }
  else if (a === "quitar-foto"){ limpiarFoto(); S.assistMsg = ""; render(); }
  else if (a === "probar") probar();
  else if (a === "sync"){ flush(); toast(navigator.onLine ? "Sincronizando…" : "Sin señal: se sube cuando regrese"); }
});
main.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  S.vals[k] = e.target.value;
  if (S.missing.includes(k)){ S.missing = S.missing.filter(x => x !== k); const f = e.target.closest(".field"); if (f) f.classList.remove("missing"); }
  if (k === "concepto"){ const b = $("#conc-badge"); if (b) b.innerHTML = conceptoBadge(); }
  if (["cantidad","precio","costo"].includes(k)){ const t = $(".total"); if (t) t.outerHTML = totalHtml(); }
});
main.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "mes-mov"){ S.mesMov = el.value; render(); return; }
  if (el.id === "filtro"){ S.filtro = el.value; render(); return; }
  if (el.id === "mes-res"){ S.mesRes = el.value; render(); return; }
  if (el.dataset && el.dataset.clasif){
    if (!navigator.onLine || !configurada()){ toast("Clasificar necesita señal"); el.checked = false; return; }
    const id = el.dataset.clasif, clase = el.value;
    try { await api("clasificar", { concepto_id:id, clase, quien:S.yo || "app" }); const c = S.conceptos.get(id); if (c) c.clase = clase; toast("Clasificado: " + CLASES[clase]); render(); flush(); }
    catch(err){ toast(errorTexto(err)); el.checked = false; }
    return;
  }
  const k = el.dataset && el.dataset.k; if (!k) return;
  S.vals[k] = el.value;
  if (k === "linea"){ S.vals.subcategoria = ""; render(); return; }
  if (k === "producto" && S.tipo === "venta"){
    const prev = movimientos().filter(m => m.tipo === "venta" && m.producto === el.value).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))[0];
    if (prev){
      let ch = false;
      if (!S.vals.precio && prev.precio_unitario != null && prev.precio_unitario !== ""){ S.vals.precio = String(prev.precio_unitario); ch = true; }
      if (!S.vals.costo && prev.costo_unitario != null && prev.costo_unitario !== ""){ S.vals.costo = String(prev.costo_unitario); ch = true; }
      if (!S.vals.linea && prev.linea){ S.vals.linea = prev.linea; S.vals.subcategoria = prev.subcategoria || ""; ch = true; }
      if (ch) render();
    }
  }
});
$("#foto-input").addEventListener("change", e => onFoto(e.target.files && e.target.files[0]));

/* ---------- arranque ---------- */
async function init(){
  await refreshQueue();
  route();
  if ("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
  if (navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
  if (configurada() && navigator.onLine) flush();
}
init();
})();
</script>
